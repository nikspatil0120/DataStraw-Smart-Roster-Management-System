[build]
builder = "dockerfile"
dockerfile = "./Dockerfile"

[deploy]
startCommand = "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyMaxRetries = 5

[env]
PYTHONUNBUFFERED = "1"
ENVIRONMENT = "production"
DEBUG = "false"
PORT = "8000"
